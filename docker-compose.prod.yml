version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  mongo:
    restart: always
    ports: []  # Don't expose MongoDB publicly in production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sentinel}

  redis:
    restart: always
    ports: []  # Don't expose Redis publicly in production
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme}

  qdrant:
    restart: always
    ports: []  # Don't expose Qdrant publicly in production

  backend:
    build:
      target: production
    restart: always
    volumes: []  # No volume mounts in production (immutable image)
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-sentinel}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_VERSION: v1
      WORKER_URL: http://worker:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sentinel}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}

  frontend:
    build:
      target: production
    restart: always
    volumes: []  # No volume mounts in production
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_URL: ${API_URL:-/api/v1}
      VITE_WS_URL: ${WS_URL:-}
      VITE_APP_NAME: Sentinel

  worker:
    build:
      target: production
    restart: always
    volumes: []  # No volume mounts in production
    environment:
      PYTHONUNBUFFERED: 1
      WORKER_PORT: 8000
      CORS_ORIGINS: ${BACKEND_URL:-http://backend:3000}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-sentinel}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-gemini}
      MODEL_NAME: ${MODEL_NAME:-gemini-2.0-flash-exp}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
